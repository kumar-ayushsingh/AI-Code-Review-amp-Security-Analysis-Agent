[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-analysis"
version = "1.0.0"
description = "Code smell detection agent for Python and Java source code"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []   # stdlib only

[project.scripts]
code-analysis = "code_analysis.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
